{{/* Android coming soon, opening to a Netlify form: an email to tell when it's on Google Play. */}}
<details class="mh-android">
  <summary class="mh-soon">Android coming soon · <u>Get notified</u></summary>
  <form class="mh-form" name="mandarinhero-android" method="POST" action="/apps/mandarinhero/android/" data-netlify="true" netlify-honeypot="company">
    <input type="hidden" name="form-name" value="mandarinhero-android">
    <p class="mh-hp"><label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label></p>
    <div class="mh-form-row">
      <input type="email" name="email" required placeholder="you@example.com" autocomplete="email" aria-label="Email address">
      <button type="submit" class="mh-btn">Notify me</button>
    </div>
    <p class="mh-form-note">One email when it's on Google Play. Nothing else.</p>
  </form>
</details>
