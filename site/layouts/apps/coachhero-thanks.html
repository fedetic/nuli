{{ define "main" }}
{{ $app := .Parent }}

<div class="ch">
  <section class="ch-thanks ch-end">
    <div class="ch-wrap">
      <img src="{{ $app.Params.icon }}" alt="" class="ch-end-icon" width="256" height="256">
      <p class="ch-kicker">Welcome to the team</p>
      <h1 class="ch-h2 ch-end-title">You're on the list.<br><em>Your coaches will be in touch.</em></h1>
      <p class="ch-intro">We'll email you when your beta spot opens. Can't wait? The open-source coach already runs on your computer today.</p>
      <div class="ch-cta ch-center">
        <a href="{{ $app.RelPermalink }}" class="ch-btn ch-btn-ghost">Back to Coach Hero</a>
        <a href="{{ $app.Params.pluginUrl }}" class="ch-btn">Try it on your computer</a>
      </div>
    </div>
  </section>
</div>

{{ end }}
