{{ define "main" }}

<div class="ph3 bg-off-white">
  <div class="center mw6 pv5">
    <h1 class="f1 lh-title b mb3">{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="f4 grey-3 mb4">{{ . }}</p>{{ end }}
    {{ with .Site.GetPage "apps" }}
      {{ range .Pages }}
        {{ partial "app-card" . }}
      {{ end }}
    {{ end }}
  </div>
</div>

{{ end }}
